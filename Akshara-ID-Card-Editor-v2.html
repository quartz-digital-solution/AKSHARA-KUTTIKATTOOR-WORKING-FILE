const ICON='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><circle cx="80" cy="53" r="27" fill="#a28790"/><path d="M29 137v-12c0-27 22-42 51-42s51 15 51 42v12z" fill="#a28790"/></svg>');
const $=id=>document.getElementById(id);const fields=['name','address1','address2','phone'];const defaults={name:'NAME',address1:'ADDRESS LINE 1',address2:'ADDRESS LINE 2',phone:'0000000000'};let nextId=2;const students=[{id:1,...defaults,photo:null,photoExt:null}];let pickId=1,busy=false;
$('art').src=ART;$('ribbon').src=RIBBON;$('firstImg').src=ICON;
function note(t='',error=false){$('status').textContent=t;$('status').classList.toggle('error',error)}
function scale(){ $('stage').style.transform='scale('+($('preview').clientWidth/638)+')' }new ResizeObserver(scale).observe($('preview'));scale();
const measuring=document.createElement('canvas').getContext('2d');function sizeFor(text,max,start){let n=start;while(n>9){measuring.font='800 '+n+'px Arial';if(measuring.measureText(text.toUpperCase()).width<=max)break;n--}return n}
function syncFirstRow(){const row=document.querySelector('[data-id="1"]');if(!row)return;for(const f of fields){const input=row.querySelector('[data-field="'+f+'"]');if(input.value!==students[0][f])input.value=students[0][f]}const thumb=row.querySelector('.thumb img');thumb.src=students[0].photo||ICON;thumb.classList.toggle('placeholder',!students[0].photo);row.classList.remove('badrow')}
function fitFirst(){const s=students[0];$('name').parentElement.style.fontSize=sizeFor(s.name,399,40)+'px';for(const f of ['address1','address2'])$(f).style.fontSize=sizeFor(s[f],422,34)+'px';$('phone').parentElement.style.fontSize=sizeFor('PH : '+s.phone,422,34)+'px'}
for(const f of fields){const e=$(f);e.addEventListener('focus',()=>{if(e.textContent===defaults[f]){const r=document.createRange();r.selectNodeContents(e);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}});e.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();e.blur()}});e.addEventListener('input',()=>{students[0][f]=e.textContent.replace(/[\r\n]+/g,' ');e.classList.remove('bad');fitFirst();syncFirstRow();note()});e.addEventListener('blur',()=>{const v=e.textContent.trim();e.textContent=v;students[0][f]=v;if(f==='address1'&&v&&v.toUpperCase()!==defaults.address1&&students[0].address2===defaults.address2){students[0].address2='';$('address2').textContent=''}fitFirst();syncFirstRow()})}fitFirst();
function choose(id){if(busy)return;pickId=id;$('picker').value='';$('picker').click()}
$('firstPhoto').onclick=()=>choose(1);
function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('Cannot open this image. Use JPG, PNG or WebP.'));im.src=src})}
function dataUrl(file){return new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(file)})}
$('picker').onchange=async()=>{const file=$('picker').files[0],id=pickId;if(!file)return;try{const img=await loadImage(await dataUrl(file));const factor=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*factor));c.height=Math.max(1,Math.round(img.naturalHeight*factor));c.getContext('2d').drawImage(img,0,0,c.width,c.height);const s=students.find(x=>x.id===id);if(!s)return;s.photo=c.toDataURL('image/png');s.photoExt='png';if(id===1){$('firstImg').src=s.photo;$('firstImg').classList.remove('placeholder');$('firstPhoto').classList.remove('bad');syncFirstRow()}else{const thumb=document.querySelector('[data-id="'+id+'"] .thumb img');if(thumb){thumb.src=s.photo;thumb.classList.remove('placeholder')}}note()}catch(e){note(e.message||'Image upload failed.',true)}};
function rowFor(s){const r=document.createElement('div');r.className='row'+(s.id===1?' first-row':'');r.dataset.id=s.id;const n=document.createElement('span');n.className='number';r.append(n);const p=document.createElement('button');p.className='thumb';p.type='button';p.setAttribute('aria-label','Upload student photo');const im=document.createElement('img');im.src=s.photo||ICON;im.className=s.photo?'':'placeholder';im.alt='';p.append(im);p.onclick=()=>choose(s.id);r.append(p);for(const f of fields){const input=document.createElement('input');input.className='field';input.type=f==='phone'?'tel':'text';input.placeholder={name:'Name',address1:'Address line 1',address2:'Address line 2',phone:'Phone number'}[f];input.setAttribute('aria-label',input.placeholder);input.value=s[f];input.dataset.field=f;input.oninput=()=>{s[f]=input.value;if(s.id===1){$(f).textContent=input.value;$(f).classList.remove('bad');if(f==='address1'&&input.value.trim()&&input.value.toUpperCase()!==defaults.address1&&s.address2===defaults.address2){s.address2='';$('address2').textContent='';r.querySelector('[data-field="address2"]').value=''}fitFirst()}r.classList.remove('badrow');note()};r.append(input)}const del=document.createElement('button');del.className='remove';del.type='button';del.setAttribute('aria-label','Remove this student');del.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></svg>';if(s.id===1){del.disabled=true;del.tabIndex=-1;del.setAttribute('aria-hidden','true')}del.onclick=()=>{if(busy||s.id===1)return;students.splice(students.indexOf(s),1);r.remove();renumber();note()};r.append(del);return r}
function renumber(){ $('records').hidden=false;Array.from($('rows').children).forEach((r,i)=>r.querySelector('.number').textContent=i+1)}
$('rows').append(rowFor(students[0]));renumber();
$('add').onclick=()=>{if(busy)return;const s={id:nextId++,name:'',address1:'',address2:'',phone:'',photo:null};students.push(s);const r=rowFor(s);$('rows').append(r);renumber();r.querySelector('[data-field="name"]').focus({preventScroll:true});r.scrollIntoView({block:'nearest'});note()};
function clean(s){const o={...s};for(const f of fields)o[f]=String(s[f]||'').trim();if(o.address2.toUpperCase()===defaults.address2)o.address2='';return o}
function validate(){document.querySelectorAll('.bad,.badrow').forEach(el=>el.classList.remove('bad','badrow'));for(let i=0;i<students.length;i++){const s=clean(students[i]);let missing=[];if(!s.photo)missing.push('photo');if(!s.name||s.name.toUpperCase()===defaults.name)missing.push('name');if(!s.address1||s.address1.toUpperCase()===defaults.address1)missing.push('address1');if(!s.phone||!/^\+?[\d\s()-]{7,20}$/.test(s.phone)||s.phone.replace(/\D/g,'').length<7||/^0+$/.test(s.phone.replace(/\D/g,'')))missing.push('phone');if(missing.length){if(i===0){for(const f of missing)$(f==='photo'?'firstPhoto':f).classList.add('bad');document.querySelector('[data-id="1"]').classList.add('badrow');$('preview').scrollIntoView({block:'nearest'})}else{const row=document.querySelector('[data-id="'+s.id+'"]');row.classList.add('badrow');row.scrollIntoView({block:'nearest'})}note('Card '+(i+1)+': add a valid '+missing.map(x=>x==='address1'?'address':x).join(', ')+'.',true);return false}}return true}
const assets=Promise.all([loadImage(ART),loadImage(RIBBON),loadImage(ICON)]);
function cover(ctx,im,x,y,w,h){const scale=Math.max(w/im.naturalWidth,h/im.naturalHeight);const sw=w/scale,sh=h/scale;ctx.drawImage(im,(im.naturalWidth-sw)/2,(im.naturalHeight-sh)/2,sw,sh,x,y,w,h)}
async function card(s){const [art,ribbon,icon]=await assets;const c=document.createElement('canvas');c.width=638;c.height=1016;const ctx=c.getContext('2d');ctx.drawImage(art,0,0);ctx.save();ctx.beginPath();ctx.ellipse(324.5,425.5,157.5,156.5,0,0,Math.PI*2);ctx.clip();if(s.photo){cover(ctx,await loadImage(s.photo),167,269,315,313)}else{ctx.drawImage(icon,241,342,167,167)}ctx.restore();ctx.drawImage(ribbon,0,0);ctx.textBaseline='top';ctx.fillStyle='#1d0a67';const name=s.name.toUpperCase();const n=sizeFor(name,399,40);ctx.font='800 '+n+'px Arial';ctx.textAlign='center';ctx.fillText(name,338.5,623);const width=ctx.measureText(name).width;ctx.fillRect(338.5-width/2,623+n*1.1+2,width,3);ctx.fillStyle='#050002';ctx.textAlign='left';for(const [text,y] of [[s.address1,685],[s.address2,730],['PH : '+s.phone,775]]){ctx.font='800 '+sizeFor(text,422,34)+'px Arial';ctx.fillText(text.toUpperCase(),179,y)}return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Card export failed.')),'image/png'))}
const enc=new TextEncoder();const crcTable=Uint32Array.from({length:256},(_,i)=>{for(let k=0;k<8;k++)i=i&1?0xedb88320^(i>>>1):i>>>1;return i>>>0});function crc(a){let v=0xffffffff;for(const x of a)v=crcTable[(v^x)&255]^(v>>>8);return(v^0xffffffff)>>>0}function zip(entries){const chunks=[],central=[];let offset=0,cs=0;for(const [name,bytes] of entries){const n=enc.encode(name),sum=crc(bytes),l=new Uint8Array(30+n.length),d=new DataView(l.buffer);d.setUint32(0,0x04034b50,true);d.setUint16(4,20,true);d.setUint16(6,0x800,true);d.setUint32(14,sum,true);d.setUint32(18,bytes.length,true);d.setUint32(22,bytes.length,true);d.setUint16(26,n.length,true);l.set(n,30);const h=new Uint8Array(46+n.length),v=new DataView(h.buffer);v.setUint32(0,0x02014b50,true);v.setUint16(4,20,true);v.setUint16(6,20,true);v.setUint16(8,0x800,true);v.setUint32(16,sum,true);v.setUint32(20,bytes.length,true);v.setUint32(24,bytes.length,true);v.setUint16(28,n.length,true);v.setUint32(42,offset,true);h.set(n,46);chunks.push(l,bytes);central.push(h);offset+=l.length+bytes.length;cs+=h.length}const end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,entries.length,true);v.setUint16(10,entries.length,true);v.setUint32(12,cs,true);v.setUint32(16,offset,true);return new Blob([...chunks,...central,end],{type:'application/zip'})}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function details(s,i){return `${i+1}. ${s.name}\nAddress: ${[s.address1,s.address2].filter(Boolean).join(', ')}\nPhone: ${s.phone}\nPhoto: photos/${String(i+1).padStart(3,'0')}.png`}
async function orderZip(ss){const entries=[];for(let i=0;i<ss.length;i++){const s=ss[i],n=String(i+1).padStart(3,'0');entries.push(['cards/'+n+'.png',new Uint8Array(await(await card(s)).arrayBuffer())]);if(s.photo)entries.push(['photos/'+n+'.png',new Uint8Array(await(await fetch(s.photo)).arrayBuffer())])}entries.push(['order.txt',enc.encode('Akshara ID card order\nTotal: '+ss.length+'\n\n'+ss.map(details).join('\n\n'))]);return zip(entries)}
function setBusy(value){busy=value;for(const id of ['add','order','firstPhoto'])$(id).disabled=value;$('orderLabel').textContent=value?'Preparing order…':'Order via WhatsApp';document.querySelectorAll('.field,.thumb,.remove').forEach(e=>e.disabled=value||e.matches('.first-row .remove'));for(const f of fields)$(f).contentEditable=value?'false':'plaintext-only'}
async function runOrder(){if(busy||!validate())return;const ss=students.map(clean);let popup=null;try{popup=window.open('about:blank','_blank');if(popup){popup.opener=null;popup.document.title='Preparing WhatsApp order';popup.document.body.textContent='Preparing your ID card order…'}}catch{}setBusy(true);note('');try{const blob=await orderZip(ss);let msg='Akshara ID card order\nTotal cards: '+ss.length+'\n\n'+ss.map(details).join('\n\n')+'\n\nI will attach the order ZIP containing the photos and cards.';if(encodeURIComponent(msg).length>6500)msg='Akshara ID card order\nTotal cards: '+ss.length+'\nFull student details, photos and finished cards are in the order ZIP.';const url='https://wa.me/919562886916?text='+encodeURIComponent(msg);downloadBlob(blob,'Akshara-ID-Cards.zip');note('Attach Akshara-ID-Cards.zip in WhatsApp and tap Send.');if(popup&&!popup.closed){try{popup.location.href=url;return}catch{}}const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent=' Open WhatsApp';$('status').append(a)}catch(e){if(popup&&!popup.closed)popup.close();note(e.message||'Could not prepare order. Please try again.',true)}finally{setBusy(false)}}
$('order').onclick=runOrder;
</script></body></html>
